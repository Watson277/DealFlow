[project]
name = "dealflow"
version = "0.1.0"
description = "Agentic RFP and sales automation platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiokafka>=0.12,<1",
    "aiomysql>=0.2,<1",
    "alembic>=1.14,<2",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.3,<2",
    "minio>=7.2,<8",
    "openai>=1.60,<3",
    "orjson>=3.10,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.19,<2",
    "redis>=5.2,<7",
    "sse-starlette>=2.2,<4",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.4,<26",
    "tenacity>=9,<10",
    "tiktoken>=0.9,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.4,<6",
    "torch==2.8.0",
]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require running infrastructure services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
