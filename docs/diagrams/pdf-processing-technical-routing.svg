<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5d7185; }
      .group-title { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .box-title { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #526b82; }
      .tiny { font-size: 12px; fill: #63798d; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; }
      .arrow { fill: none; stroke: #55758f; stroke-width: 3; marker-end: url(#arrow); }
      .route { fill: none; stroke: #1599b8; stroke-width: 3; marker-end: url(#arrowCyan); }
      .warn-line { fill: none; stroke: #d99112; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowAmber); }
      .soft-line { fill: none; stroke: #99acbc; stroke-width: 2; stroke-dasharray: 5 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55758f"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1599b8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d99112"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f7fafc"/>
  <text x="70" y="58" class="title">PDF 处理技术框架与路由逻辑</text>
  <text x="70" y="91" class="subtitle">页面级分类 · 多模态提取 · OCR 降级 · 版面结构化</text>
  <rect x="1548" y="35" width="300" height="42" rx="21" fill="#e9f4f8"/>
  <text x="1698" y="62" text-anchor="middle" class="label" fill="#167f9b">DocumentIR Pipeline v1.0</text>

  <!-- Group 1: Input -->
  <g filter="url(#shadow)">
    <rect x="40" y="125" width="285" height="665" rx="20" fill="#ffffff" stroke="#b6c8d7" stroke-width="2"/>
    <path d="M40 145 Q40 125 60 125 H305 Q325 125 325 145 V180 H40 Z" fill="#315f8c"/>
  </g>
  <text x="182" y="161" text-anchor="middle" class="group-title">1. 输入与预检</text>

  <rect x="82" y="218" width="200" height="78" rx="14" fill="#eaf2fa" stroke="#3775ba" stroke-width="2"/>
  <text x="182" y="251" text-anchor="middle" class="box-title">PDF 文件</text>
  <text x="182" y="277" text-anchor="middle" class="small">bytes + filename + document_id</text>

  <path d="M182 296 V337" class="arrow"/>
  <rect x="67" y="340" width="230" height="126" rx="14" fill="#eaf2fa" stroke="#3775ba" stroke-width="2"/>
  <text x="182" y="374" text-anchor="middle" class="box-title">文件预检</text>
  <text x="182" y="402" text-anchor="middle" class="small">有效性 · 加密状态</text>
  <text x="182" y="426" text-anchor="middle" class="small">页数上限 · PDF 元数据</text>
  <text x="182" y="450" text-anchor="middle" class="mono">PDFPreflightValidator</text>

  <path d="M182 466 V513" class="arrow"/>
  <rect x="82" y="516" width="200" height="90" rx="14" fill="#eaf2fa" stroke="#3775ba" stroke-width="2"/>
  <text x="182" y="550" text-anchor="middle" class="box-title">逐页加载</text>
  <text x="182" y="580" text-anchor="middle" class="small">PyMuPDF Page</text>

  <path d="M67 398 H30 V675 H68" class="warn-line"/>
  <rect x="68" y="645" width="228" height="80" rx="12" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="182" y="678" text-anchor="middle" class="label" fill="#9b6406">预检失败</text>
  <text x="182" y="704" text-anchor="middle" class="small">拒绝处理 · 不进入页面解析</text>

  <!-- Group 2: Router -->
  <g filter="url(#shadow)">
    <rect x="355" y="125" width="330" height="665" rx="20" fill="#ffffff" stroke="#8ac7d5" stroke-width="2"/>
    <path d="M355 145 Q355 125 375 125 H665 Q685 125 685 145 V180 H355 Z" fill="#1599b8"/>
  </g>
  <text x="520" y="161" text-anchor="middle" class="group-title">2. 页面质量路由</text>
  <path d="M282 560 H342 V294 H391" class="route"/>

  <rect x="393" y="207" width="254" height="174" rx="16" fill="#e9f7fa" stroke="#1599b8" stroke-width="2.5"/>
  <text x="520" y="242" text-anchor="middle" class="box-title">页面质量路由器</text>
  <text x="420" y="278" class="small">● 有效字符数</text>
  <text x="420" y="306" class="small">● 乱码比例</text>
  <text x="420" y="334" class="small">● 图片覆盖率</text>
  <text x="420" y="362" class="small">● 文本覆盖率</text>

  <path d="M520 381 V420" class="route"/>
  <path d="M520 420 H430 V452" class="route"/>
  <path d="M520 420 V545" class="route"/>
  <path d="M520 420 H610 V638" class="route"/>

  <rect x="380" y="455" width="220" height="76" rx="12" fill="#eaf2fa" stroke="#3775ba" stroke-width="2"/>
  <text x="490" y="484" text-anchor="middle" class="label">原生文字页</text>
  <text x="490" y="511" text-anchor="middle" class="small">文本充足 · 乱码低</text>

  <rect x="380" y="548" width="220" height="76" rx="12" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="490" y="577" text-anchor="middle" class="label">扫描图片页</text>
  <text x="490" y="604" text-anchor="middle" class="small">图片覆盖高 · 文本不足</text>

  <rect x="380" y="641" width="220" height="76" rx="12" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="490" y="670" text-anchor="middle" class="label">混合低质量页</text>
  <text x="490" y="697" text-anchor="middle" class="small">文字 + 图片 · 质量不足</text>

  <rect x="390" y="740" width="260" height="30" rx="15" fill="#f3f7fa"/>
  <text x="520" y="761" text-anchor="middle" class="tiny">page_type: text / scanned / mixed / empty</text>

  <!-- Group 3: Extraction -->
  <g filter="url(#shadow)">
    <rect x="715" y="125" width="655" height="665" rx="20" fill="#ffffff" stroke="#b6c8d7" stroke-width="2"/>
    <path d="M715 145 Q715 125 735 125 H1350 Q1370 125 1370 145 V180 H715 Z" fill="#315f8c"/>
  </g>
  <text x="1042" y="161" text-anchor="middle" class="group-title">3. 多模态并行提取</text>

  <!-- Native text lane -->
  <rect x="742" y="205" width="602" height="122" rx="14" fill="#f4f8fc" stroke="#8bb1d6" stroke-width="2"/>
  <rect x="742" y="205" width="116" height="122" rx="14" fill="#dceafa"/>
  <text x="800" y="252" text-anchor="middle" class="label">文字通道</text>
  <text x="800" y="278" text-anchor="middle" class="tiny">原生页</text>
  <path d="M600 493 H700 V266 H886" class="arrow"/>
  <rect x="888" y="224" width="250" height="84" rx="12" fill="#eaf2fa" stroke="#3775ba" stroke-width="2"/>
  <text x="1013" y="255" text-anchor="middle" class="label">原生文本提取</text>
  <text x="1013" y="281" text-anchor="middle" class="small">文本 · 字体 · 字号 · bbox</text>
  <rect x="1160" y="232" width="155" height="66" rx="11" fill="#ffffff" stroke="#3775ba" stroke-width="2"/>
  <text x="1237" y="258" text-anchor="middle" class="mono">get_text</text>
  <text x="1237" y="280" text-anchor="middle" class="tiny">TEXT Block</text>
  <path d="M1138 266 H1158" class="arrow"/>

  <!-- OCR lane -->
  <rect x="742" y="348" width="602" height="176" rx="14" fill="#fffaf0" stroke="#e4ad47" stroke-width="2"/>
  <rect x="742" y="348" width="116" height="176" rx="14" fill="#fff0cb"/>
  <text x="800" y="409" text-anchor="middle" class="label">OCR 通道</text>
  <text x="800" y="436" text-anchor="middle" class="tiny">扫描 / 混合页</text>
  <path d="M600 586 H695 V408 H740" class="warn-line"/>
  <path d="M600 679 H710 V459 H740" class="warn-line"/>
  <rect x="880" y="372" width="142" height="72" rx="11" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="951" y="402" text-anchor="middle" class="label">整页渲染</text>
  <text x="951" y="426" text-anchor="middle" class="small">250 DPI</text>
  <path d="M1022 408 H1048" class="warn-line"/>
  <rect x="1050" y="372" width="150" height="72" rx="11" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="1125" y="402" text-anchor="middle" class="label">Tesseract OCR</text>
  <text x="1125" y="426" text-anchor="middle" class="small">chi_sim + eng</text>
  <path d="M1200 408 H1224" class="warn-line"/>
  <rect x="1226" y="372" width="96" height="72" rx="11" fill="#ffffff" stroke="#d99112" stroke-width="2"/>
  <text x="1274" y="400" text-anchor="middle" class="label">OCR</text>
  <text x="1274" y="424" text-anchor="middle" class="tiny">TEXT Block</text>
  <text x="884" y="476" class="small">成功：替换低质量原生文本块</text>
  <text x="884" y="503" class="small">失败/关闭：保留原生块 + ParseWarning</text>

  <!-- Image lane -->
  <rect x="742" y="546" width="602" height="98" rx="14" fill="#f5f8fa" stroke="#aabcc9" stroke-width="2"/>
  <rect x="742" y="546" width="116" height="98" rx="14" fill="#e7eef3"/>
  <text x="800" y="588" text-anchor="middle" class="label">图片通道</text>
  <text x="800" y="613" text-anchor="middle" class="tiny">所有页面并行</text>
  <rect x="884" y="561" width="246" height="67" rx="11" fill="#ffffff" stroke="#8098aa" stroke-width="2"/>
  <text x="1007" y="588" text-anchor="middle" class="label">图片区域检测</text>
  <text x="1007" y="612" text-anchor="middle" class="small">bbox · 元数据</text>
  <path d="M1130 594 H1170" class="arrow"/>
  <rect x="1172" y="561" width="150" height="67" rx="11" fill="#ffffff" stroke="#8098aa" stroke-width="2"/>
  <text x="1247" y="602" text-anchor="middle" class="label">IMAGE Block</text>

  <!-- Table lane -->
  <rect x="742" y="665" width="602" height="98" rx="14" fill="#f5f8fa" stroke="#aabcc9" stroke-width="2"/>
  <rect x="742" y="665" width="116" height="98" rx="14" fill="#e7eef3"/>
  <text x="800" y="706" text-anchor="middle" class="label">表格通道</text>
  <text x="800" y="731" text-anchor="middle" class="tiny">所有页面并行</text>
  <rect x="884" y="680" width="246" height="67" rx="11" fill="#ffffff" stroke="#8098aa" stroke-width="2"/>
  <text x="1007" y="706" text-anchor="middle" class="label">原生表格检测</text>
  <text x="1007" y="730" text-anchor="middle" class="mono">PyMuPDF find_tables</text>
  <path d="M1130 713 H1170" class="arrow"/>
  <rect x="1172" y="680" width="150" height="67" rx="11" fill="#ffffff" stroke="#8098aa" stroke-width="2"/>
  <text x="1247" y="706" text-anchor="middle" class="label">TABLE Block</text>
  <text x="1247" y="731" text-anchor="middle" class="tiny">Markdown + bbox</text>

  <!-- Loaded pages feed image and table detection independently from text quality routing. -->
  <path d="M282 580 H338 V806 H700 V594 H740" class="soft-line" marker-end="url(#arrow)"/>
  <path d="M700 713 H740" class="soft-line" marker-end="url(#arrow)"/>

  <!-- Group 4: Structuring -->
  <g filter="url(#shadow)">
    <rect x="1400" y="125" width="480" height="665" rx="20" fill="#ffffff" stroke="#b6a9db" stroke-width="2"/>
    <path d="M1400 145 Q1400 125 1420 125 H1860 Q1880 125 1880 145 V180 H1400 Z" fill="#6552a5"/>
  </g>
  <text x="1640" y="161" text-anchor="middle" class="group-title">4. 合并、版面与统一输出</text>

  <path d="M1315 265 H1382 V258 H1430" class="arrow"/>
  <path d="M1322 408 H1382 V258 H1430" class="arrow"/>
  <path d="M1322 594 H1382 V258 H1430" class="arrow"/>
  <path d="M1322 713 H1382 V258 H1430" class="arrow"/>
  <rect x="1432" y="211" width="416" height="94" rx="14" fill="#f1eefb" stroke="#6552a5" stroke-width="2"/>
  <text x="1640" y="247" text-anchor="middle" class="box-title">块候选合并</text>
  <text x="1640" y="276" text-anchor="middle" class="small">TEXT / OCR + IMAGE + TABLE</text>
  <text x="1640" y="296" text-anchor="middle" class="tiny">来源：native / ocr / derived</text>

  <path d="M1640 305 V342" class="arrow"/>
  <rect x="1432" y="345" width="416" height="128" rx="14" fill="#f1eefb" stroke="#6552a5" stroke-width="2"/>
  <text x="1640" y="379" text-anchor="middle" class="box-title">版面结构分析</text>
  <text x="1510" y="415" class="small">● 页眉 / 页脚</text>
  <text x="1665" y="415" class="small">● 标题 / 列表</text>
  <text x="1510" y="445" class="small">● 多栏检测</text>
  <text x="1665" y="445" class="small">● 阅读顺序 / 表格去重</text>

  <path d="M1640 473 V508" class="arrow"/>
  <rect x="1432" y="510" width="188" height="92" rx="14" fill="#f1eefb" stroke="#6552a5" stroke-width="2"/>
  <text x="1526" y="546" text-anchor="middle" class="box-title">PageIR</text>
  <text x="1526" y="573" text-anchor="middle" class="tiny">page_type · blocks</text>
  <text x="1526" y="590" text-anchor="middle" class="tiny">warnings · metadata</text>
  <path d="M1620 556 H1658" class="arrow"/>
  <rect x="1660" y="510" width="188" height="92" rx="14" fill="#e8f7ee" stroke="#2f9f62" stroke-width="2"/>
  <text x="1754" y="546" text-anchor="middle" class="box-title">DocumentIR v1.0</text>
  <text x="1754" y="573" text-anchor="middle" class="tiny">pages · bbox · SHA-256</text>
  <text x="1754" y="590" text-anchor="middle" class="tiny">status · warnings</text>

  <path d="M1754 602 V635 H1640" class="arrow"/>
  <rect x="1432" y="638" width="416" height="105" rx="14" fill="#e8f7ee" stroke="#2f9f62" stroke-width="2"/>
  <text x="1640" y="672" text-anchor="middle" class="box-title" fill="#207b4b">统一持久化</text>
  <rect x="1470" y="690" width="170" height="36" rx="9" fill="#ffffff" stroke="#2f9f62"/>
  <text x="1555" y="714" text-anchor="middle" class="mono">document-ir.v1.json</text>
  <rect x="1660" y="690" width="150" height="36" rx="9" fill="#ffffff" stroke="#2f9f62"/>
  <text x="1735" y="714" text-anchor="middle" class="mono">parsed.txt</text>

  <!-- Bottom degradation lane -->
  <g filter="url(#shadow)">
    <rect x="40" y="825" width="1840" height="148" rx="18" fill="#fffaf0" stroke="#e4ad47" stroke-width="2"/>
  </g>
  <text x="80" y="863" class="box-title" fill="#9b6406">降级与失败路由</text>
  <rect x="300" y="847" width="460" height="82" rx="13" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="530" y="879" text-anchor="middle" class="label">OCR 失败 / OCR 关闭</text>
  <text x="530" y="906" text-anchor="middle" class="small">保留原生文本块 → ParseWarning</text>
  <rect x="790" y="847" width="460" height="82" rx="13" fill="#fff4df" stroke="#d99112" stroke-width="2"/>
  <text x="1020" y="879" text-anchor="middle" class="label">表格检测失败等非致命问题</text>
  <text x="1020" y="906" text-anchor="middle" class="small">DocumentIR.status = partial_success</text>
  <rect x="1280" y="847" width="550" height="82" rx="13" fill="#fdeaea" stroke="#b64342" stroke-width="2"/>
  <text x="1555" y="879" text-anchor="middle" class="label" fill="#9b3332">最终无可提取文本</text>
  <text x="1555" y="906" text-anchor="middle" class="small">DocumentParser 终止 → 解析失败</text>
  <path d="M1125 524 V810 H530 V845" class="warn-line"/>
  <path d="M1007 747 V803 H1020 V845" class="warn-line"/>
  <path d="M1250 930 H1278" class="warn-line"/>

  <!-- Legend -->
  <rect x="40" y="1005" width="1840" height="48" rx="12" fill="#ffffff" stroke="#d7e1e8"/>
  <circle cx="260" cy="1029" r="8" fill="#3775ba"/><text x="278" y="1035" class="small">蓝色：原生提取</text>
  <circle cx="560" cy="1029" r="8" fill="#1599b8"/><text x="578" y="1035" class="small">青色：质量路由</text>
  <circle cx="860" cy="1029" r="8" fill="#d99112"/><text x="878" y="1035" class="small">琥珀色：OCR 与降级</text>
  <circle cx="1195" cy="1029" r="8" fill="#6552a5"/><text x="1213" y="1035" class="small">紫色：版面结构</text>
  <circle cx="1505" cy="1029" r="8" fill="#2f9f62"/><text x="1523" y="1035" class="small">绿色：统一输出</text>
</svg>
