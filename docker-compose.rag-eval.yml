name: dealflow-rag-eval

services:
  qdrant-eval:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${RAG_EVAL_QDRANT_PORT:-16333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  rag-eval:
    build:
      context: .
      dockerfile: Dockerfile
    image: dealflow-app:local
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant-eval:6333
      CAPABILITY_RERANKER_ENABLED: "true"
      CAPABILITY_RERANKER_DEVICE: cuda
      LOCAL_ARTIFACT_EXPORT_ENABLED: "false"
    depends_on:
      qdrant-eval:
        condition: service_healthy
    command:
      - python
      - -m
      - app.rag.evaluate_cli
      - --isolated
      - --mode
      - all
      - --dataset
      - evals/retrieval/business_queries.jsonl
      - --corpus-manifest
      - evals/retrieval/business_corpus.json
      - --top-k
      - "5"
      - --candidate-k
      - "30"
      - --report-dir
      - evals/retrieval/reports/latest
    gpus: all
    volumes:
      - ./evals/retrieval/reports:/app/evals/retrieval/reports
      - huggingface_cache:/app/.cache/huggingface

volumes:
  huggingface_cache:
    name: dealflow-huggingface-cache
